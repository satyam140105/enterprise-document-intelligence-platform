# Enterprise Document Intelligence Platform — default config

project:
  display_name: Enterprise Document Intelligence Platform
  name: enterprise-document-intelligence-platform
  package: docintel
  version: 1.0.0
  status: released

data:
  raw_dir: data/raw
  processed_dir: data/processed
  samples_dir: data/samples
  supported_formats: [pdf, txt]

processing:
  ocr_mode: digital_first
  chunk_strategy: recursive
  chunk_size: 120
  chunk_overlap: 20
  embedding_model: sentence-transformers/all-MiniLM-L6-v2

retrieval:
  top_k: 5
  similarity_metric: cosine

generation:
  citation_required: true
  max_context_chunks: 5
  default_mode: extractive

store:
  backend: local  # local file store for demo/CI; postgres via Compose optional

api:
  max_upload_mb: 20
  max_batch_size: 32

mlflow:
  experiment_name: document-intelligence

evaluation:
  primary_metric: retrieval_hit_rate
  secondary_metrics: [citation_coverage, faithfulness_checklist]
